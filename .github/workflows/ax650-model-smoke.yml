name: AX650 Model Smoke Tests

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model key. Use all to validate every enabled model."
        required: false
        default: "all"
        type: string

permissions:
  contents: read

concurrency:
  group: ax650-model-validation
  cancel-in-progress: false

jobs:
  build:
    name: Build AX650 Smoke Tool
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential unzip wget

      - name: Cross-Compile
        run: bash -euxo pipefail ./build_ax650.sh

      - name: Upload Target Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax650-model-smoke-${{ github.sha }}
          retention-days: 7
          path: build/install

  validate:
    name: Run AX650 Model Smoke Tests
    needs: build
    runs-on: [self-hosted, linux, arm64, ax650, npu]
    timeout-minutes: 180
    env:
      HTTP_PROXY: http://10.126.102.152:3128
      HTTPS_PROXY: http://10.126.102.152:3128
      NO_PROXY: localhost,127.0.0.1
      LD_LIBRARY_PATH: /soc/lib
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Target Artifact
        uses: actions/download-artifact@v4
        with:
          name: ax650-model-smoke-${{ github.sha }}
          path: .ci/ax650

      - name: Run Model Manifest
        run: |
          chmod +x "$GITHUB_WORKSPACE/.ci/ax650/bin/llm_smoke"
          python3 scripts/ci/run_model_matrix.py \
            --manifest .github/tests/ax650_models.json \
            --model "${{ inputs.model }}" \
            --model-root /mnt/ssd/llm_smoke \
            --binary "$GITHUB_WORKSPACE/.ci/ax650/bin/llm_smoke" \
            --result-root "$GITHUB_WORKSPACE/model-results"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax650-model-results-${{ github.run_id }}
          retention-days: 30
          path: model-results
