name: AX650 模型清单验证

on:
  workflow_dispatch:
    inputs:
      model:
        description: "模型 key，输入 all 验证全部启用模型"
        required: false
        default: "all"
        type: string

permissions:
  contents: read

concurrency:
  group: ax650-model-validation
  cancel-in-progress: false

jobs:
  build:
    name: 构建 AX650 冒烟工具
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential unzip wget

      - name: 交叉构建
        run: bash -euxo pipefail ./build_ax650.sh

      - name: 上传板端验证产物
        uses: actions/upload-artifact@v4
        with:
          name: ax650-model-smoke-${{ github.sha }}
          retention-days: 7
          path: build/install

  validate:
    name: AX650 模型清单冒烟
    needs: build
    runs-on: [self-hosted, linux, arm64, ax650, npu]
    timeout-minutes: 180
    env:
      HTTP_PROXY: http://10.126.102.152:3128
      HTTPS_PROXY: http://10.126.102.152:3128
      NO_PROXY: localhost,127.0.0.1
      LD_LIBRARY_PATH: /soc/lib
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载板端验证产物
        uses: actions/download-artifact@v4
        with:
          name: ax650-model-smoke-${{ github.sha }}
          path: .ci/ax650

      - name: 验证模型清单
        run: |
          chmod +x "$GITHUB_WORKSPACE/.ci/ax650/bin/llm_smoke"
          python3 scripts/ci/run_model_matrix.py \
            --manifest tests/ax650_models.json \
            --model "${{ inputs.model }}" \
            --model-root /mnt/ssd/llm_smoke \
            --binary "$GITHUB_WORKSPACE/.ci/ax650/bin/llm_smoke" \
            --result-root "$GITHUB_WORKSPACE/model-results"

      - name: 上传验证结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax650-model-results-${{ github.run_id }}
          retention-days: 30
          path: model-results
