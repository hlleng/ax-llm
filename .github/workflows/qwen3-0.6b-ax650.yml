name: Qwen3 0.6B AX650 验证

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ax650-model-validation
  cancel-in-progress: false

jobs:
  build:
    name: 构建 AX650 冒烟工具
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 安装构建依赖
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential unzip wget

      - name: 交叉构建
        run: bash -euxo pipefail ./build_ax650.sh

      - name: 上传板端验证产物
        uses: actions/upload-artifact@v4
        with:
          name: ax650-model-smoke-${{ github.sha }}
          retention-days: 7
          path: build/install

  validate:
    name: AX650 Qwen3 0.6B 冒烟
    needs: build
    runs-on: [self-hosted, linux, arm64, ax650, npu]
    timeout-minutes: 45
    env:
      HTTP_PROXY: http://10.126.102.152:3128
      HTTPS_PROXY: http://10.126.102.152:3128
      NO_PROXY: localhost,127.0.0.1
      LD_LIBRARY_PATH: /soc/lib
    steps:
      - uses: actions/checkout@v4

      - name: 下载板端验证产物
        uses: actions/download-artifact@v4
        with:
          name: ax650-model-smoke-${{ github.sha }}
          path: .ci/ax650

      - name: 验证 Qwen3 0.6B
        run: |
          chmod +x "$GITHUB_WORKSPACE/.ci/ax650/bin/llm_smoke"
          python3 scripts/ci/model_smoke.py \
            --model-id AXERA-TECH/Qwen3-0.6B \
            --revision 9bd240869b5ec6f28964a635cd421a80fcad9dc8 \
            --model-root /mnt/ssd/llm_smoke \
            --binary "$GITHUB_WORKSPACE/.ci/ax650/bin/llm_smoke" \
            --result-dir "$GITHUB_WORKSPACE/model-results/Qwen3-0.6B" \
            --dynamic-load-pool 2 \
            --max-tokens 8

      - name: 上传验证结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-0.6b-ax650-result-${{ github.run_id }}
          retention-days: 30
          path: model-results/Qwen3-0.6B
